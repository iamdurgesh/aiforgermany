name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least-Privilege für das GITHUB_TOKEN (Supply-Chain-Härtung)
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency-Audit-Gate (WORKING MAP §6.9)
      - run: npm audit --audit-level=moderate
      - run: npm run generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
