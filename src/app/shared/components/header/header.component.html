<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-brand" [routerLink]="localizedRouter.path()">
      <img class="site-brand__logo" src="/assets/afg_Logo2_header.png" alt="AIforGermany" />
      <span class="site-brand__name">AIforGermany</span>
    </a>

    <nav [attr.aria-label]="'header.primaryNavigation' | t" class="site-nav">
      @for (item of navigation; track item.route) {
        <a
          [routerLink]="localizedRouter.path(item.route)"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        >
          {{ item.labelKey | t }}
        </a>
      }
    </nav>

    <div class="site-header__actions">
      <div class="locale-switcher" [attr.aria-label]="'common.language' | t">
        @for (locale of locales; track locale.code) {
          <button
            type="button"
            [class.is-active]="localeService.currentLocale() === locale.code"
            [attr.aria-pressed]="localeService.currentLocale() === locale.code"
            (click)="switchLocale(locale.code)"
          >
            {{ locale.code.toUpperCase() }}
          </button>
        }
      </div>

      <a
        class="button button-premium site-header__cta"
        [routerLink]="localizedRouter.path('newsletter')"
      >
        {{ 'header.joinNewsletter' | t }}
      </a>
    </div>
  </div>
</header>
