<article class="article-card surface-card">
  <div class="article-card__meta">
    <span class="tag">{{ translate.category(article().categoryKey) }}</span>
    <div class="meta-row">
      <span>{{ article().publishedAt | localizedDate: 'mediumDate' }}</span>
      <span>{{ translate.readTime(article().readTimeMinutes) }}</span>
    </div>
  </div>

  <div class="article-card__body">
    <h3>{{ article().title }}</h3>
    <p>{{ article().excerpt }}</p>
  </div>

  <a class="article-card__link" [routerLink]="localizedRouter.articlePath(article().slug)">
    {{ 'common.readArticle' | t }}
  </a>
</article>
