<section class="newsletter-cta surface-card">
  <div class="newsletter-cta__content">
    <p class="eyebrow">{{ 'newsletterCta.eyebrow' | t }}</p>
    <h2>{{ title() || ('newsletterCta.title' | t) }}</h2>
    <p>{{ description() || ('newsletterCta.description' | t) }}</p>
  </div>

  <a class="button button-primary" [routerLink]="localizedRouter.path('newsletter')">
    {{ 'newsletterCta.button' | t }}
  </a>
</section>
