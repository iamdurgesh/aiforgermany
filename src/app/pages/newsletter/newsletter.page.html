<section class="page-section">
  <div class="container newsletter-page">
    <div class="surface-card newsletter-page__panel">
      <app-section-heading
        [eyebrow]="'pages.newsletter.intro.eyebrow' | t"
        [title]="'pages.newsletter.intro.title' | t"
        [description]="'pages.newsletter.intro.description' | t"
      ></app-section-heading>

      <div class="split-grid">
        <div class="rich-text">
          <p>{{ 'pages.newsletter.body.one' | t }}</p>
          <p>{{ 'pages.newsletter.body.two' | t }}</p>
        </div>

        <form class="newsletter-form surface-card">
          <label>
            <span>{{ 'pages.newsletter.form.name' | t }}</span>
            <input type="text" [placeholder]="'pages.newsletter.form.namePlaceholder' | t">
          </label>

          <label>
            <span>{{ 'pages.newsletter.form.email' | t }}</span>
            <input type="email" [placeholder]="'pages.newsletter.form.emailPlaceholder' | t">
          </label>

          <button class="button button-primary" type="button">{{ 'pages.newsletter.form.button' | t }}</button>
        </form>
      </div>
    </div>

    <div class="surface-card newsletter-page__notes">
      <h2>{{ 'pages.newsletter.expectations.title' | t }}</h2>
      <ul>
        @for (item of editorialValue(); track item) {
          <li>{{ item }}</li>
        }
      </ul>
    </div>
  </div>
</section>
