<section class="page-section">
  <div class="container about-page">
    <div class="surface-card about-page__panel">
      <app-section-heading
        [eyebrow]="'pages.about.intro.eyebrow' | t"
        [title]="'pages.about.intro.title' | t"
        [description]="'pages.about.intro.description' | t"
      ></app-section-heading>

      <div class="split-grid">
        <div class="rich-text">
          <p>{{ 'pages.about.body.one' | t }}</p>
          <p>{{ 'pages.about.body.two' | t }}</p>
        </div>

        <div class="about-page__principles">
          <h2>{{ 'pages.about.principles.title' | t }}</h2>
          <ul>
            @for (principle of principles(); track principle) {
              <li>{{ principle }}</li>
            }
          </ul>
        </div>
      </div>
    </div>

    <app-newsletter-cta></app-newsletter-cta>
  </div>
</section>
