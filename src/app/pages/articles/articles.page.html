<section class="page-section">
  <div class="container">
    <div class="page-intro">
      <app-section-heading
        [eyebrow]="'pages.articles.intro.eyebrow' | t"
        [title]="'pages.articles.intro.title' | t"
        [description]="'pages.articles.intro.description' | t"
      ></app-section-heading>

      <div class="category-row">
        @for (category of categories(); track category) {
          <span class="tag">{{ translate.category(category) }}</span>
        }
      </div>
    </div>

    <div class="articles-grid">
      @for (article of articles(); track article.slug) {
        <app-article-card [article]="article"></app-article-card>
      }
    </div>
  </div>
</section>
